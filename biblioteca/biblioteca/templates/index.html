<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biblioteca</title>
    <!-- CDN Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

    <!-- Banner de bienvenida -->
    <header class="bg-blue-600 text-white py-12">
        <div class="container mx-auto text-center">
            <h1 class="text-4xl font-bold mb-4">¡Bienvenido a mi Biblioteca!</h1>

        </div>
    </header>

    <!-- Contenido principal -->
    <main class="container mx-auto mt-12 px-4">
        <div class="bg-white rounded-lg shadow-md p-8 text-center">
            <h2 class="text-2xl font-semibold mb-4">Mira los libros</h2>
            <p class="text-gray-700">Aqui podras ver los libros disponibles</p>
            <a href="/libros" class="mt-6 inline-block bg-blue-600 text-white px-6 py-3 rounded-lg hover:bg-blue-700 transition">Ver libros</a>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white mt-12 py-6 text-center">
        &copy; Footer Biblioteca. Todos los derechos reservados.
    </footer>

</body>
</html>
